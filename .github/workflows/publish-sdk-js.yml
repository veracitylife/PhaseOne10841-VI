name: Publish SDK (JavaScript)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and validate without publishing
        required: false
        default: true
        type: boolean
      npm_tag:
        description: npm dist-tag
        required: false
        default: latest
        type: choice
        options: [latest, beta, next]

permissions:
  contents: read

concurrency:
  group: publish-sdk-js
  cancel-in-progress: false

defaults:
  run:
    working-directory: packages/sdk-js

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org

      # This package has no lockfile, so npm ci and npm cache-by-lockfile cannot work.
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Run SDK tests
        run: npm test
      - name: Validate package or publish
        if: ${{ inputs.dry_run }}
        run: npm publish --dry-run --tag "${{ inputs.npm_tag }}" --access public
      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: npm publish --tag "${{ inputs.npm_tag }}" --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}