name: Publish SDK (Python)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and validate without publishing
        required: false
        default: true
        type: boolean
      repository:
        description: PyPI repository
        required: false
        default: pypi
        type: choice
        options: [pypi, testpypi]

permissions:
  contents: read

concurrency:
  group: publish-sdk-python
  cancel-in-progress: false

defaults:
  run:
    working-directory: packages/sdk-python

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install package and build tools
        run: python -m pip install --upgrade pip build twine pytest pytest-asyncio respx && python -m pip install -e .
      - name: Run SDK tests
        run: python -m pytest tests/
      - name: Build and validate distributions
        run: python -m build && twine check dist/*
      - name: Publish to TestPyPI
        if: ${{ !inputs.dry_run && inputs.repository == 'testpypi' }}
        run: twine upload --repository testpypi dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
      - name: Publish to PyPI
        if: ${{ !inputs.dry_run && inputs.repository == 'pypi' }}
        run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}