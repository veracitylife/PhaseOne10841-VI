# PhaseOne10841 Python SDK publish workflow
# DEFENSIVE ONLY — no secrets committed
#
# Manual workflow_dispatch only. Requires PYPI_API_TOKEN secret.
# Set up PYPI_API_TOKEN in GitHub repository secrets before publishing.

name: Publish SDK (Python)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual publish)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      repository:
        description: 'PyPI repository (pypi, testpypi)'
        required: false
        default: 'pypi'
        type: choice
        options:
          - 'pypi'
          - 'testpypi'

defaults:
  run:
    working-directory: packages/sdk-python

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine pytest pytest-asyncio

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: List package contents
        run: |
          echo "=== Package files ==="
          ls -la dist/
          echo ""
          echo "=== Wheel contents ==="
          python -c "import zipfile; [print(f) for f in zipfile.ZipFile('dist/phaseone_client-*.whl').namelist()]" || true

      - name: Publish (dry run)
        if: ${{ inputs.dry_run == 'true' }}
        run: |
          echo "=== DRY RUN ==="
          echo "Would publish phaseone-client to ${{ inputs.repository }}"
          echo ""
          echo "Package info:"
          twine check dist/*
          echo ""
          echo "Files to upload:"
          ls -la dist/

      - name: Publish to TestPyPI
        if: ${{ inputs.dry_run == 'false' && inputs.repository == 'testpypi' }}
        run: |
          twine upload --repository testpypi dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}

      - name: Publish to PyPI
        if: ${{ inputs.dry_run == 'false' && inputs.repository == 'pypi' }}
        run: |
          twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create GitHub Release
        if: ${{ inputs.dry_run == 'false' }}
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: sdk-python-v${{ github.run_number }}
          release_name: "phaseone-client v${{ github.run_number }}"
          body: |
            PhaseOne10841 Python SDK release.
            
            Install: `pip install phaseone-client`
            
            See [SDK documentation](docs/sdk-python.md) for usage.
          draft: true
          prerelease: ${{ inputs.repository == 'testpypi' }}
