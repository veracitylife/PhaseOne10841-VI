[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phaseone-client"
version = "0.8.0-pre"
description = "PhaseOne10841 Python Client SDK — Defensive Agent Security Gateway"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Veracity Integrity LLC", email = "support@veracityintegrity.com" }
]
keywords = ["phaseone", "agent-security", "agent-edr", "llm-security", "ai-security", "defensive"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "respx>=0.20",
]

[project.urls]
Homepage = "https://VeracityIntegrity.com"
Repository = "https://github.com/veracityintegrity/phaseone10841"
Documentation = "https://github.com/veracityintegrity/phaseone10841/blob/main/docs/sdk-python.md"

[tool.hatch.build.targets.wheel]
packages = ["phaseone_client"]
