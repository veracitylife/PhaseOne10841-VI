{{- $secretName := include "phaseone.secretName" . -}}
{{- if and .Values.existingSecret.create (not .Values.existingSecret.name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "phaseone.labels" . | nindent 4 }}
  annotations:
    phaseone.veracityintegrity.com/notice: "Placeholder secret — populate keys via kubectl before production use."
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{- if ne $key "DATABASE_URL" }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.postgres.enabled }}
  DATABASE_URL: {{ printf "postgres://%s:REPLACE_VIA_KUBECTL@%s:%d/%s" .Values.postgres.auth.username (include "phaseone.postgresServiceName" .) (.Values.postgres.service.port | int) .Values.postgres.auth.database | quote }}
  {{- else }}
  DATABASE_URL: {{ .Values.secrets.DATABASE_URL | quote }}
  {{- end }}
{{- end }}
