apiVersion: v1
kind: Service
metadata:
  name: {{ include "phaseone.dashboardServiceName" . }}
  labels:
    {{- include "phaseone.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
  {{- with .Values.service.dashboard.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.dashboard.type }}
  ports:
    - port: {{ .Values.service.dashboard.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "phaseone.dashboardSelectorLabels" . | nindent 4 }}
