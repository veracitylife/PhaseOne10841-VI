apiVersion: apps/v1
kind: Deployment
metadata:
  name: phaseone-dashboard
  labels:
    app.kubernetes.io/name: phaseone
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: phaseone
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: phaseone
        app.kubernetes.io/component: dashboard
    spec:
      serviceAccountName: phaseone
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: phaseone:0.1.1
          imagePullPolicy: IfNotPresent
          command:
            - tsx
            - dashboard/src/server.ts
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: phaseone-config
          env:
            - name: GATEWAY_URL
              value: http://phaseone-gateway:8080
            - name: PHASEONE_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: phaseone-secrets
                  key: PHASEONE_SESSION_SECRET
            - name: PHASEONE_ADMIN_EMAILS
              valueFrom:
                secretKeyRef:
                  name: phaseone-secrets
                  key: PHASEONE_ADMIN_EMAILS
            - name: PHASEONE_VIEWER_EMAILS
              valueFrom:
                secretKeyRef:
                  name: phaseone-secrets
                  key: PHASEONE_VIEWER_EMAILS
                  optional: true
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: phaseone-secrets
                  key: SMTP_HOST
                  optional: true
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: phaseone-secrets
                  key: SMTP_USER
                  optional: true
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: phaseone-secrets
                  key: SMTP_PASS
                  optional: true
            - name: PHASEONE_OIDC_ISSUER
              valueFrom:
                secretKeyRef:
                  name: phaseone-secrets
                  key: PHASEONE_OIDC_ISSUER
                  optional: true
            - name: PHASEONE_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: phaseone-secrets
                  key: PHASEONE_OIDC_CLIENT_ID
                  optional: true
            - name: PHASEONE_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: phaseone-secrets
                  key: PHASEONE_OIDC_CLIENT_SECRET
                  optional: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
