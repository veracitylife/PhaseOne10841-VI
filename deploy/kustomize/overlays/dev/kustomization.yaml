apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: phaseone-dev

nameSuffix: -dev

resources:
  - ../../base

replicas:
  - name: phaseone-gateway
    count: 1
  - name: phaseone-dashboard
    count: 1

patches:
  - path: patches/configmap-env.yaml

images:
  - name: phaseone
    newTag: "0.1.1"

commonLabels:
  environment: dev
