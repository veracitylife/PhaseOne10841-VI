apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: phaseone

resources:
  - ../../base
  - ingress.yaml
  - cronjob-backup.yaml

replicas:
  - name: phaseone-gateway
    count: 3
  - name: phaseone-dashboard
    count: 2

patches:
  - path: patches/gateway-resources.yaml
  - path: patches/dashboard-resources.yaml
  - path: patches/configmap-env.yaml
  - path: patches/external-db.yaml

images:
  - name: phaseone
    newTag: "0.1.2"

commonLabels:
  environment: prod
