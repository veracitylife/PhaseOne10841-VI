id: phaseone.shell.denied
title: Shell execution denied
description: Shell tool calls denied by policy (deny-by-default).
status: stable
level: medium
enabled: true
logsource:
  product: PhaseOne10841
detection:
  selection:
    # Match common shell tool ids used by agents / policy (tune to your fleet)
    tool_name:
      - run_shell
      - shell_exec
      - unrestricted_shell
      - raw_shell
      - bash
      - Shell
    decision: deny
  condition: selection
