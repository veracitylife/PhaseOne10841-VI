# PhaseOne10841 — Caddy TLS edge overlay
# Veracity Integrity LLC · https://VeracityIntegrity.com
#
# Prerequisites: base stack healthy (docker compose up), then:
#   docker compose -f docker-compose.yml -f docker-compose.proxy.yml up -d
# Docs: docs/proxy.md
# URLs: https://phaseone.localhost  ·  https://gateway.phaseone.localhost
# Set PHASEONE_SECURE_COOKIES=true when using HTTPS.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gateway
      - dashboard
volumes:
  caddy_data:
  caddy_config:
